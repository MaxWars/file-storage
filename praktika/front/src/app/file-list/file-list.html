<div class="container">
  <div class="header">
    <h2>Мои файлы</h2>
    <button mat-raised-button color="warn" (click)="logout()">Выйти</button>
  </div>

  <button mat-fab color="primary" class="add-button" (click)="openUploadDialog()">+</button>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width">
    <ng-container matColumnDef="filename">
      <th mat-header-cell *matHeaderCellDef> Имя файла </th>
      <td mat-cell *matCellDef="let file"> {{file.filename}} </td>
    </ng-container>

    <ng-container matColumnDef="size">
      <th mat-header-cell *matHeaderCellDef> Размер (байт) </th>
      <td mat-cell *matCellDef="let file"> {{file.size}} </td>
    </ng-container>

    <ng-container matColumnDef="upload_time">
      <th mat-header-cell *matHeaderCellDef> Дата загрузки </th>
      <td mat-cell *matCellDef="let file"> {{file.upload_time | date:'medium'}} </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Описание </th>
      <td mat-cell *matCellDef="let file"> {{file.description}} </td>
    </ng-container>

    <ng-container matColumnDef="theme">
      <th mat-header-cell *matHeaderCellDef> Тема </th>
      <td mat-cell *matCellDef="let file"> {{file.theme}} </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Действия </th>
      <td mat-cell *matCellDef="let file">
        <button mat-icon-button color="primary" (click)="downloadFile(file); $event.stopPropagation()" matTooltip="Скачать">
          <mat-icon>download</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteFile(file); $event.stopPropagation()" matTooltip="Удалить">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openFileDetail(row)"></tr>
  </table>
</div>
